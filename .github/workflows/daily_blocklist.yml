name: Update BlockList Automatically

on:
  schedule:
    # Se ejecuta todos los días a las 21:00 hora de Chile (01:00 AM UTC del día siguiente)
    - cron: '0 1 * * *'
  workflow_dispatch: # Permite ejecutar manualmente desde GitHub UI

permissions:
  contents: write

# Mismo grupo que el auditor de colegios: no escriben la lista al mismo tiempo.
concurrency:
  group: blocklist-write
  cancel-in-progress: false

jobs:
  update-blocklist:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run BlockList Updater
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # La API de GitHub admite más búsquedas con el token del workflow; urlscan, más con su
          # clave (opcional).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          URLSCAN_API_KEY: ${{ secrets.URLSCAN_API_KEY }}
        run: |
          python3 scripts/update_blocklist.py

      - name: Regenerate Hosts Format
        run: |
          python3 scripts/generate_hosts_format.py

      - name: Run Quality Linter & Whitelist Validation
        run: |
          python3 scripts/validate_blocklist.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add GamesBlockList.txt GamesBlockList_hosts.txt keywords.txt
          if git diff --staged --quiet; then
            echo "No changes in blocklist today."
          else
            git commit -m "auto: update GamesBlockList.txt and multi-format hosts [skip ci]"
            # main puede haber cambiado durante la corrida (un merge, el auditor de colegios):
            # se trae lo nuevo y se reintenta. Si dos cambios tocan la misma línea, falla aquí.
            for i in 1 2 3; do
              git push && exit 0
              git pull --rebase origin main || { git rebase --abort; exit 1; }
              python3 scripts/generate_hosts_format.py
              python3 scripts/validate_blocklist.py
              git add GamesBlockList_hosts.txt
              git diff --staged --quiet || git commit -m "auto: regenerate hosts after rebase [skip ci]"
            done
            exit 1
          fi
