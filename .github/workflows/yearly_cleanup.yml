name: Dead Domain Cleanup (manual)

# Solo a mano (desactivado el 2026-11-06): sacar dominios muertos ahorra poco (~0,8 % de la lista)
# y los sitios de juegos expirados suelen volver como espejos. Si se corre, revisa el commit.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup-dead-domains:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run Active DNS Sweeper (Limpieza de Dominios Caducados)
        run: |
          python3 scripts/cleanup_dead_domains.py

      - name: Run Quality Linter & Whitelist Validation
        run: |
          python3 scripts/validate_blocklist.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add GamesBlockList.txt GamesBlockList_hosts.txt
          if git diff --staged --quiet; then
            echo "No dead domains found this year."
          else
            git commit -m "auto: yearly cleanup of dead domains [skip ci]"
            git push
          fi
